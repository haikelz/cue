name: Release

# Pushing a tag such as v0.5.0 tests that commit, builds Cue.app, and attaches cue-0.5.0.zip to a
# GitHub Release. The zip holds the app, install.sh and uninstall.sh, the Amp plugin and the docs;
# install.sh installs the built app without Swift. The runner builds for Apple silicon only.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The tag matches Info.plist
        run: test "$GITHUB_REF_NAME" = "v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)"

      - name: Unit tests
        run: swift test

      - name: Build
        run: swift build -c release

      - name: Checks
        run: tests/check.sh
        env:
          HOOK_BUDGET_MS: 200

      - name: Package
        run: |
          name="cue-${GITHUB_REF_NAME#v}"
          ./install.sh --bundle "dist/$name/Cue.app"
          cp -R install.sh uninstall.sh plugins docs README.md "dist/$name/"
          ditto -c -k --keepParent "dist/$name" "dist/$name.zip"

      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" "dist/cue-${GITHUB_REF_NAME#v}.zip" --title "Cue ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
